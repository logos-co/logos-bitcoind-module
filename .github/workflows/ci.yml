name: CI

# The nix half: the plugin, its package, libbitcoind_c underneath them, and rpc()'s allowlist
# compiled and run on its own. Then the Windows cross build.

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: nix build
    # ATTIC_TOKEN_PUBLIC only exists in the public-cache environment.
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix and set up the shared cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Build plugin and package
        # `lgx` is the plugin plus packaging; `default` adds the generated consumer API.
        run: nix build -L .#lgx .#default

      - name: rpc()'s allowlist
        run: nix flake check -L

      - name: The library and Core's licence ship beside the plugin
        run: |
          set -euo pipefail
          nix build -L .#install-portable -o result
          payload=result/modules/bitcoind_module
          ls -l "$payload"
          set -- "$payload"/libbitcoind_c.*
          [ -e "$1" ] || { echo "::error::libbitcoind_c is not in the payload"; exit 1; }
          for l in COPYING.bitcoin NOTICES.bitcoind_c; do
            [ -s "$payload/$l" ] || { echo "::error::$l is not in the payload"; exit 1; }
          done

  windows:
    # The cross build on Linux, the PE and import-closure gates and the hand-off live in
    # logos-co/logos-windows-ci. No smoke: a module plugin has no entry point of its own, and
    # logos-bitcoin-core-nix's CI runs the node itself on Windows.
    uses: logos-co/logos-windows-ci/.github/workflows/windows-ci.yml@v1
    secrets: inherit
    with:
      targets: default
      # Measured 18 derivations to build on a cold cache (2026-10-11); libbitcoind_c compiles
      # among them until a cache holds it.
      timeout-minutes: 120
